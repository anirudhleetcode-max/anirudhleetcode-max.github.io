<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-MRYbtCECxTnVryCtxqL6koMhswRsOEtmKz1ENRcvDO8='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Not here</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box;
      background: radial-gradient(120% 90% at 50% 100%, #2a1640 0%, #120a22 55%, #0b0614 100%);
      color: #e9dcc4; font: 400 18px/1.6 Georgia, "Times New Roman", serif;
    }
    .lantern { width: 44px; height: 60px; margin: 0 auto 28px; border-radius: 40% 40% 32% 32%; background: radial-gradient(60% 55% at 50% 70%, #ffd98a 0%, #f4a944 45%, #8a4b22 100%); box-shadow: 0 0 40px 10px rgba(255, 190, 90, .25); }
    h1 { font-weight: 400; font-size: 26px; margin: 0 0 8px; letter-spacing: .02em; }
    p { margin: 0 0 28px; color: #b9a6c9; }
    a { color: #ffd98a; text-decoration: none; border: 1px solid rgba(255, 217, 138, .5); border-radius: 999px; padding: 10px 22px; display: inline-block; }
    a:hover, a:focus-visible { background: rgba(255, 217, 138, .1); outline: 2px solid #ffd98a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="lantern" aria-hidden="true"></div>
    <h1>This page drifted away.</h1>
    <p>There’s nothing at this address.</p>
    <a id="home" href="/birthday/" data-home="/birthday/">Go to the film</a>
  </main>
  <script>(function () {
  // GitHub Pages serves this page for any missing path; the film lives at /<repository>/ (published
  // into a site repository, the publish step names its folder in data-home)
  var a = document.getElementById('home');
  var seg = location.pathname.split('/')[1];
  a.href = a.getAttribute('data-home') || (/\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/');
})();</script>
</body>
</html>
